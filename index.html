<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مدیر فنی و معمار نرم‌افزار با سابقهٔ توسعهٔ سامانه‌های معاملاتی بازار سرمایه">
  <title>M. Reza Layeghi | معرفی</title>
  <style>
    :root {
      color-scheme: light;
      background: #fff;
      color: #000;
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-block-size: 100vh;
      min-block-size: 100svh;
      display: grid;
      align-items: center;
      margin: 0;
      padding: clamp(1.5rem, 7vw, 6.5rem);
    }

    main {
      width: min(100%, 76rem);
      margin-inline: auto;
      border-block-start: 1px solid;
      padding-block-start: clamp(1.75rem, 5vw, 4rem);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      column-gap: clamp(2rem, 7vw, 7rem);
      row-gap: 2rem;
      align-items: center;
    }

    h1 {
      grid-column: 2;
      grid-row: 1;
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: clamp(3.3rem, 8.5vw, 8rem);
      font-weight: 700;
      line-height: .94;
      letter-spacing: -.075em;
    }

    h1 span { display: block; }

    .details {
      grid-column: 1;
      grid-row: 1;
    }

    .role {
      margin: 0;
      font-size: clamp(1.125rem, 2.25vw, 1.65rem);
      font-weight: 700;
      line-height: 1.6;
    }

    .bio {
      max-inline-size: 42ch;
      margin: 1rem 0 1.5rem;
      font-size: clamp(1rem, 1.4vw, 1.125rem);
      line-height: 2;
    }

    .linkedin {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      min-block-size: 2.75rem;
      border-block-end: 1px solid;
      color: inherit;
      font: 600 1rem/1.4 system-ui, sans-serif;
      text-decoration: none;
    }

    .linkedin:hover { border-block-end-width: 2px; }
    .linkedin:focus-visible { outline: 2px solid; outline-offset: .35rem; }

    @media (max-width: 48rem) {
      main { grid-template-columns: minmax(0, 1fr); }
      h1, .details { grid-area: auto; }
      h1 { text-align: right; }
    }
  </style>
</head>
<body>
  <main>
    <h1 lang="en" dir="ltr"><span>M. Reza</span> <span>Layeghi</span></h1>
    <div class="details">
      <p class="role">مدیر فنی و معمار نرم‌افزار</p>
      <p class="bio">بیش از ۲۰ سال در توسعه نرم‌افزار تجربه دارم که حدود ۱۱ سال آن در سامانه‌های معاملاتی بازار سرمایه بوده است. تمرکز من بر طراحی این سامانه‌ها و رهبری تیم‌های توسعه است.</p>
      <a class="linkedin" href="https://www.linkedin.com/in/m-reza-layeghi/" lang="en" dir="ltr">
        LinkedIn <span aria-hidden="true">↗</span>
      </a>
    </div>
  </main>
</body>
</html>
