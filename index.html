<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مدیر فنی و معمار نرم‌افزار با سابقهٔ توسعهٔ سامانه‌های معاملاتی بازار سرمایه">
  <title>M. Reza Layeghi | معرفی</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: #fff;
      color: #000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-block-size: 100vh;
      min-block-size: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 3rem);
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(1.5rem, 6vw, 3.5rem);
      border: 1px solid currentColor;
      border-radius: 1.25rem;
    }

    h1 {
      margin: 0;
      text-align: right;
      font-family: system-ui, sans-serif;
      font-size: clamp(1.85rem, 6vw, 3rem);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .role {
      margin: .9rem 0 0;
      font-weight: bold;
      line-height: 1.8;
    }

    .bio {
      margin: 1.5rem 0;
      line-height: 2.05;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: .35rem .65rem;
      border: 1px solid currentColor;
      border-radius: .45rem;
      font: .85rem/1.4 system-ui, sans-serif;
    }

    a {
      display: inline-block;
      margin-block-start: 1.5rem;
      color: inherit;
      text-underline-offset: .25em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: .35rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 lang="en" dir="ltr">M. Reza Layeghi</h1>
    <p class="role">مدیر فنی و معمار نرم‌افزار</p>
    <p class="bio">بیش از ۲۰ سال در توسعه نرم‌افزار تجربه دارم که حدود ۱۱ سال آن در سامانه‌های معاملاتی بازار سرمایه بوده است. تمرکز من بر طراحی این سامانه‌ها و رهبری تیم‌های توسعه است.</p>
    <ul aria-label="فناوری‌های اصلی">
      <li lang="en" dir="ltr">C#</li>
      <li lang="en" dir="ltr">.NET</li>
      <li lang="en" dir="ltr">SQL Server</li>
      <li lang="en" dir="ltr">Kubernetes</li>
    </ul>
    <a href="https://github.com/mrlayeghi">پروفایل گیت‌هاب</a>
  </main>
</body>
</html>
